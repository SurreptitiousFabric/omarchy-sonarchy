[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N", "BLE", "S"]

[tool.ruff.lint.per-file-ignores]
# Test doubles mirror SoCo's UPnP action names, and Unicode metadata is tested
# exactly as speakers return it.
"tests/**" = ["B017", "N802", "RUF001", "S101", "S108"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
files = [
  "sonarchy_mcp_contract.py",
  "sonarchy_mcp/browse.py",
  "sonarchy_backend/domains/browse.py",
  "sonarchy_backend/domains/apple_browse.py",
  "sonarchy_backend/domains/ports.py",
]
# Keep imported signatures, but report diagnostics only for the selected slice.
# Unlike skip/ignore_missing_imports, this does not replace our imports with Any.
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
