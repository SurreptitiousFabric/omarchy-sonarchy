name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up pinned Mise toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: true
          install: true
      - name: Install hash-locked test dependencies
        run: mise exec -- python -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r requirements-dev.lock
      - name: Check Python and shell syntax
        run: |
          mise exec -- python -m py_compile sonarchy_bridge.py sonarchy_service.py sonarchy_backend/*.py
          mise exec -- python -m json.tool manifest.json >/dev/null
          bash -n sonarchy-backend.sh
          shellcheck sonarchy-backend.sh
      - name: Check Python quality
        run: |
          mise exec -- python -m ruff check .
          mise exec -- python -m ruff format --check .
      - name: Run tests with branch coverage
        run: |
          mise exec -- python -m coverage run -m pytest -q
          mise exec -- python -m coverage report
