name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked test dependencies
        run: python -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r requirements-dev.lock
      - name: Check Python and shell syntax
        run: |
          python -m py_compile sonarchy_bridge.py sonarchy_service.py sonarchy_backend/*.py
          python -m json.tool manifest.json >/dev/null
          bash -n sonarchy-backend.sh
          shellcheck sonarchy-backend.sh
      - name: Check Python quality
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Run tests with branch coverage
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report
