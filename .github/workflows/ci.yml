name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up pinned Mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          install: true
      - name: Install hash-locked test dependencies
        run: >-
          mise exec -- python -m pip install --disable-pip-version-check
          --no-input --no-deps --only-binary=:all: --require-hashes
          -r requirements-dev.lock
      - name: Check Python and shell syntax
        run: |
          mise exec -- python -m compileall -q sonarchy_service.py sonarchy_backend
          mise exec -- python -m json.tool manifest.json >/dev/null
          bash -n sonarchy-backend.sh tests/qml/run-component-tests.sh
          mise exec -- shellcheck sonarchy-backend.sh tests/qml/run-component-tests.sh
      - name: Check Python quality
        run: |
          mise exec -- python -m ruff check .
          mise exec -- python -m ruff format --check .
      - name: Run tests with branch coverage
        run: |
          mise exec -- python -m coverage run -m pytest -q
          mise exec -- python -m coverage report
